<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>River Room · Play online with friends</title>
<script>
  // Online play now lives on the main page, on the same table as single-player.
  // Old links (/mp.html and /mp.html?code=ABC234) land in the right place.
  (function () {
    var code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
    location.replace(/^[A-Z2-9]{6}$/.test(code) ? '/?join=' + code : '/?online');
  })();
</script>
<style>html,body{margin:0;background:#0a0e0c;color:#eef1ea;font:16px system-ui,sans-serif}p{padding:24px}a{color:#d3a854}</style>
</head>
<body>
<p>Opening the online table… If nothing happens, <a href="/?online">go to the online lobby</a>.</p>
</body>
</html>
