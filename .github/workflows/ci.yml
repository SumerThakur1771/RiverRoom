name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests, golden replay and property tests (with coverage)
        run: npx vitest run --coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; const r=k=>t[k].pct+'%'; console.log('| Statements | Branches | Functions | Lines |\n|---|---|---|---|\n| '+[r('statements'),r('branches'),r('functions'),r('lines')].join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test against the production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node tools/ui/smoke.mjs http://localhost:4173/ 40 home
          node tools/ui/smoke.mjs http://localhost:4173/ 25 tourney
          node tools/ui/review-ui.mjs http://localhost:4173/
      - name: Multiplayer in the browser (two players, real server)
        run: |
          npm run server:build
          VITE_MP_SERVER_URL=http://localhost:8099 npx vite build --outDir dist-mp
          PORT=8099 TIMING=fast ALLOWED_ORIGINS=http://localhost:4177 node server/dist/main.js &
          npx vite preview --outDir dist-mp --port 4177 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4177/mp.html > /dev/null && curl -sf http://localhost:8099/health > /dev/null && break; sleep 1; done
          node tools/ui/mp-smoke.mjs http://localhost:4177/mp.html 3
      - name: AI review eval against a mock model (checks the eval pipeline, not the model)
        run: npx tsx tools/review/eval.ts --mock --min 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots-and-coverage
          path: |
            screenshots/
            coverage/
          retention-days: 14
