name: AI review eval (live)

# Runs the 20-hand review eval against the deployed /api/review: real OpenRouter models, using
# the OPENROUTER_API_KEY stored in Vercel. Manual only (Actions tab, "Run workflow").
#
#  1. Each free candidate model on its own, in parallel (separate runners, so each stays under
#     the endpoint's per-IP limit): compares the free models directly.
#  2. Then the real chain (free first, paid last): score, free vs paid split, latency per model.
# Each run sends 20 requests paced 13 s apart (about 5 minutes). Reviews are cached by hand,
# so a repeat run on the same deployment is answered from the cache; the report marks those.
on:
  workflow_dispatch:

jobs:
  single:
    name: Only ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: ['google/gemma-4-26b-a4b-it:free', 'nvidia/nemotron-3.5-super-vl:free', 'google/gemma-4-31b-it:free']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the eval with one model
        run: npx tsx tools/review/eval.ts --live https://sumer-riverroom.vercel.app/api/review --model "${{ matrix.model }}" --out review-eval.txt
      - name: Post the results as annotations (readable through the API)
        if: always()
        run: bash tools/review/annotate.sh review-eval.txt "Review eval, only ${{ matrix.model }}"

  chain:
    name: Full chain (free first, paid last)
    needs: single
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The model chain matches OpenRouter's model list (prices, JSON support)
        continue-on-error: true
        run: npx tsx tools/review/check-models.ts
      - name: Run the eval through the chain
        run: npx tsx tools/review/eval.ts --live https://sumer-riverroom.vercel.app/api/review --out review-eval.txt
      - name: Post the results as annotations (readable through the API)
        if: always()
        run: bash tools/review/annotate.sh review-eval.txt "Review eval, chain"
