name: Live smoke test

# Runs after Vercel reports a successful deployment of main. Vercel reports through a
# commit status named "Vercel", so this waits for the new version to be live.
on:
  status:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test https://sumer-riverroom.vercel.app
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Desktop and phone, home game and tournament
        run: |
          node tools/ui/smoke.mjs https://sumer-riverroom.vercel.app/ 40 home
          node tools/ui/smoke.mjs https://sumer-riverroom.vercel.app/ 25 tourney
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-screenshots
          path: screenshots/
          retention-days: 14
