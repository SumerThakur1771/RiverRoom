name: Live smoke test

# Runs after Vercel reports a successful deployment of main. Vercel reports through a
# commit status named "Vercel", so this waits for the new version to be live.
on:
  status:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test https://sumer-riverroom.vercel.app
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The AI review endpoint is deployed and validates input (no model call)
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://sumer-riverroom.vercel.app/api/review)
          echo "status $code: $(cat body.json)"
          if [ "$code" = 400 ]; then echo "::notice title=AI review endpoint::status 400: OPENROUTER_API_KEY is configured"; else echo "::notice title=AI review endpoint::status $code: OPENROUTER_API_KEY is not configured yet"; fi
          # 503 = no API key configured yet, 400 = key present and the empty body was rejected
          [ "$code" = 400 ] || [ "$code" = 503 ]
          grep -q '"fallback":true' body.json
      - name: Desktop and phone, home game and tournament
        run: |
          node tools/ui/smoke.mjs https://sumer-riverroom.vercel.app/ 40 home
          node tools/ui/smoke.mjs https://sumer-riverroom.vercel.app/ 25 tourney
      - name: Lighthouse on the live site (3 runs per page; fails below 95 accessibility)
        run: node tools/measure/lighthouse.mjs https://sumer-riverroom.vercel.app/ lighthouse 3 95
      - name: Vercel Web Analytics sends page views without query strings
        if: always()
        run: node tools/ui/analytics-check.mjs https://sumer-riverroom.vercel.app
      - name: The review's model chain matches OpenRouter's model list
        if: always()
        run: npx tsx tools/review/check-models.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-screenshots
          path: |
            screenshots/
            lighthouse/
          retention-days: 14

  multiplayer:
    name: Online play on production (Vercel page + Render server + Neon)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' && contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER: https://riverroom-server.onrender.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Render to run this commit (wakes the free server too)
        run: |
          want=$(git rev-parse --short=7 HEAD); t0=$(date +%s)
          for i in $(seq 90); do
            got=$(curl -s -m 70 "$SERVER/health" || true)
            echo "$(( $(date +%s) - t0 ))s: ${got:-no answer}"
            if echo "$got" | grep -q "\"version\":\"$want\""; then
              echo "::notice title=Multiplayer server::$SERVER runs $want ($got), answered $(( $(date +%s) - t0 )) s after the first request"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Multiplayer server::$SERVER did not report version $want within 15 minutes"; exit 1
      - name: Three browsers play online on production (waiting room, join by code); the settlement comes from Neon
        run: |
          set -o pipefail
          node tools/ui/online-ui.mjs https://sumer-riverroom.vercel.app/ --expect-stored --hands 2 | tee mp-live.txt
      - name: Post the results as annotations (readable through the API)
        if: always()
        run: |
          [ -f mp-live.txt ] || exit 0
          grep -E '^(RESULT|desktop host|phone host|page errors)' mp-live.txt | cut -c1-1500 | while IFS= read -r line; do echo "::notice title=Multiplayer on production::$line"; done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-multiplayer-screenshots
          path: screenshots/
          retention-days: 14

